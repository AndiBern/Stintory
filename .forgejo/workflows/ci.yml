# Forgejo Actions CI. Runs on the Ubuntu runner only. Windows builds and
# tests of the Windows-only capture code are done locally for now.
#
# Actions are referenced by full URL so the workflow doesn't depend on which
# actions the Forgejo instance mirrors.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - uses: https://github.com/actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check -w web
      - run: npm run lint -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit -w web -- --run
      - run: npm run test:e2e -w web
      - run: npm run build -w web

  rust:
    name: Rust
    runs-on: ubuntu-latest
    # sy-server's API tests need Postgres (they are skipped without it)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stintory
          POSTGRES_PASSWORD: stintory
          POSTGRES_DB: stintory
        options: >-
          --health-cmd "pg_isready -U stintory" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      STINTORY_TEST_DATABASE_URL: postgres://stintory:stintory@postgres:5432/stintory
    steps:
      - uses: https://github.com/actions/checkout@v5
      - name: Install system dependencies (Tauri)
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: https://github.com/actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
      # The desktop app embeds the built frontend at compile time.
      - run: npm ci
      - run: npm run build -w web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Windows-only code (live shared memory readers) can't run here, but it
      # must compile and pass clippy for the Windows target.
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo clippy --target x86_64-pc-windows-msvc -p sy-source-iracing -p sy-source-lmu --all-targets --locked -- -D warnings
      # The Proton bridge (sy-bridge.exe) is cross-built with MinGW; the
      # Linux packages ship it (npm run build:desktop:linux:docker). MinGW also
      # builds its examples' C dependencies (examples/fake_lmu.rs).
      - name: Build the Proton bridge
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --target x86_64-pc-windows-gnu -p sy-bridge --all-targets --locked -- -D warnings
          cargo build --release --locked -p sy-bridge --target x86_64-pc-windows-gnu

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v5
      - name: REUSE compliance
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends pipx
          pipx run reuse lint
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources
      # known vulnerabilities (RustSec); a new advisory fails CI even without
      # a change here: update the crate or add a reasoned ignore in deny.toml
      - run: cargo deny check advisories
      - run: node scripts/check-license-direction.mjs
