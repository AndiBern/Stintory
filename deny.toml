# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# License policy: docs/PLAN.md §12.1. The "permissive crates must not depend
# on AGPL crates" rule is checked by scripts/check-license-direction.mjs.

[graph]
all-features = true

[licenses]
# Licenses allowed for third-party dependencies. All are compatible with
# AGPL-3.0 and with distributing our MIT/Apache crates.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not every license has to be in use.
unused-allowed-license = "allow"

# Our own AGPL crates. Add an exception for every new AGPL crate.
[licenses.private]
ignore = false

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
crate = "rz-store"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
crate = "rz-capture"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
crate = "rz-analysis"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
crate = "rundenzeit-desktop"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
crate = "rz-server"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
crate = "rz-sync"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = [
  # "unmaintained" notice for a build-time macro crate pulled in by the GTK 3
  # bindings that Tauri uses on Linux (no vulnerability). Goes away when Tauri
  # moves off GTK 3; nothing we can update ourselves.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk3 on Linux, unmaintained only" },
  # "unmaintained" notices for parts of zbus (D-Bus on Linux), used by the
  # Secret Service keychain (keyring) and tauri-plugin-opener. No fixed
  # release exists; no vulnerability.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus (keyring, tauri-plugin-opener), unmaintained only" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus (keyring, tauri-plugin-opener), unmaintained only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus (keyring, tauri-plugin-opener), unmaintained only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
