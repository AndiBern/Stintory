# Stintory server + Postgres. See docs/SERVER.md.
#
#   cp docker/.env.example docker/.env   # then fill in the values
#   docker compose -f docker/compose.yml up -d --build
#
# The server listens on 127.0.0.1:8080; put your reverse proxy (TLS) in front.

name: stintory

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: stintory-server:latest
    restart: unless-stopped
    environment:
      STINTORY_DATABASE_URL: postgres://stintory:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/stintory
      STINTORY_PUBLIC_URL: ${STINTORY_PUBLIC_URL:?set STINTORY_PUBLIC_URL}
      STINTORY_SECRET_KEY: ${STINTORY_SECRET_KEY:?set STINTORY_SECRET_KEY}
      STINTORY_ADMIN_USERNAME: ${STINTORY_ADMIN_USERNAME:-}
      STINTORY_ADMIN_PASSWORD: ${STINTORY_ADMIN_PASSWORD:-}
      STINTORY_TRUST_PROXY: ${STINTORY_TRUST_PROXY:-true}
      STINTORY_OAUTH_CLIENT_METADATA: ${STINTORY_OAUTH_CLIENT_METADATA:-true}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stintory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: stintory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stintory"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  data:
  pgdata:
