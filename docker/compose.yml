# Rundenzeit server + Postgres. See docs/SERVER.md.
#
#   cp docker/.env.example docker/.env   # then fill in the values
#   docker compose -f docker/compose.yml up -d --build
#
# The server listens on 127.0.0.1:8080; put your reverse proxy (TLS) in front.

name: rundenzeit

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rundenzeit-server:latest
    restart: unless-stopped
    environment:
      RZ_DATABASE_URL: postgres://rundenzeit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/rundenzeit
      RZ_PUBLIC_URL: ${RZ_PUBLIC_URL:?set RZ_PUBLIC_URL}
      RZ_SECRET_KEY: ${RZ_SECRET_KEY:?set RZ_SECRET_KEY}
      RZ_ADMIN_USERNAME: ${RZ_ADMIN_USERNAME:-}
      RZ_ADMIN_PASSWORD: ${RZ_ADMIN_PASSWORD:-}
      RZ_TRUST_PROXY: ${RZ_TRUST_PROXY:-true}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rundenzeit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rundenzeit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rundenzeit"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  data:
  pgdata:
