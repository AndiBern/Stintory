# Postgres for developing and testing sy-server (not for production; see
# docker/compose.yml). Reachable only from this machine.
#
#   docker compose -f docker/compose.dev.yml up -d
#   export STINTORY_TEST_DATABASE_URL=postgres://stintory:stintory@127.0.0.1:55432/stintory
#   cargo test -p sy-server

name: stintory-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stintory
      POSTGRES_PASSWORD: stintory
      POSTGRES_DB: stintory
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stintory"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
