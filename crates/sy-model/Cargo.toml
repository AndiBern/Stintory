[package]
name = "sy-model"
description = "Stintory domain model and lap telemetry file format (Parquet)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["parquet", "bundle"]
## Lap telemetry file format (Parquet). Disable in crates that only need the
## model types, e.g. game adapters (keeps them free of C dependencies).
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:bytes", "dep:parquet"]
## The `.stintory` export format (ZIP).
bundle = ["dep:zip"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
hex.workspace = true
parquet = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zip = { workspace = true, optional = true }

[lints]
workspace = true
