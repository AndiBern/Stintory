[package]
name = "rz-sync"
description = "Rundenzeit sync client: device login and sync with a Rundenzeit server"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rz-capture.workspace = true
rz-model.workspace = true
rz-store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt"] }
tracing.workspace = true

[dev-dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "cookies"] }
rz-server.workspace = true
rz-source-iracing.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
