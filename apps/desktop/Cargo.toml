[package]
name = "stintory-desktop"
description = "Stintory desktop client"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
default-run = "stintory"

[lib]
name = "stintory_desktop"

[[bin]]
name = "stintory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sy-analysis.workspace = true
sy-capture.workspace = true
sy-model.workspace = true
sy-source-iracing.workspace = true
sy-store.workspace = true
sy-sync.workspace = true
keyring = "4"
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
time.workspace = true
tokio = { version = "1", features = ["sync", "time", "macros"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
